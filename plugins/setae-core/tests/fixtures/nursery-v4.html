<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SETAE Nursery Workbench v4</title>
  <script>
    const fixtureParams = new URLSearchParams(location.search);
    document.documentElement.dataset.theme = fixtureParams.get('theme') === 'dark' ? 'dark' : 'light';
    window.SETAE_CONFIG = { siteOrigin: location.origin };
  </script>
  <link rel="stylesheet" href="../../assets/app/styles/tokens.css">
  <link rel="stylesheet" href="../../assets/app/styles/reset.css">
  <link rel="stylesheet" href="../../assets/app/styles/foundation.css">
  <link rel="stylesheet" href="../../assets/app/styles/components.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/workbench.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/action-menu.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/media.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/specimen-card.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/update-notice.css">
  <link rel="stylesheet" href="../../assets/app/styles/screens/qr.css">
  <link rel="stylesheet" href="../../assets/app/styles/patterns/workspace.css">
  <link rel="stylesheet" href="../../assets/app/styles/patterns/registry.css">
  <link rel="stylesheet" href="../../assets/app/styles/patterns/ledger.css">
  <link rel="stylesheet" href="../../assets/app/styles/screens/collection.css">
  <link rel="stylesheet" href="../../assets/app/styles/screens/nursery.css">
  <style>
    body {
      min-height: 100dvh;
      background: var(--bg-app);
    }

    #app {
      width: 100%;
      min-inline-size: 0;
      padding: var(--space-6);
    }

    @media (max-width: 767px) {
      #app {
        padding: 0;
      }
    }
  </style>
</head>
<body class="setae-app-document">
  <div id="setae-gui-root" class="setae-gui-host"><main id="app"></main></div>
  <script type="module">
    import { renderCollection } from '../../assets/app/pages/collection.js';
    import { renderModal } from '../../assets/app/components/modals.js';
    import { renderNurseryCarePlanSettings } from '../../assets/app/features/nursery/care-plan-view.js';
    import { createBabyQrSelection } from '../../assets/app/features/nursery/code-selection.js';

    const mode = fixtureParams.get('mode') || 'registry';
    const itemCount = Math.max(0, Number(fixtureParams.get('items') ?? 80));
    const groupCount = Math.max(0, Number(fixtureParams.get('groups') ?? 4));
    const living = Math.max(0, Number(fixtureParams.get('living') ?? itemCount));
    const longText = fixtureParams.get('long') === '1';
    const historyCount = Math.max(0, Number(fixtureParams.get('history') ?? 8));
    const developmentCount = Math.max(0, Number(fixtureParams.get('development') ?? 3));
    const archivedCount = Math.max(0, Number(fixtureParams.get('archived') ?? 2));

    const makeItems = (count, prefix = 'B') => Array.from({ length: itemCount }, (_, index) => {
      const number = index + 1;
      const status = number > living ? (number % 2 ? 'dead' : 'rehomed') : 'alive';
      return {
        number,
        code: `${prefix}${String(number).padStart(3, '0')}`,
        status,
        last_molt: number % 4 ? '2026-08-23' : '',
        note: longText
          ? '容器内の行動位置と体色を継続観察中。非常に長い現場メモが入っても、番号別台帳は画面外へはみ出さず情報を保持します。'
          : number % 3 ? '経過観察' : '',
        history: number % 9 === 0 ? [{ type: 'molt', date: '2026-08-23', note: '脱皮を確認' }] : []
      };
    });

    const makeGroup = (index, { archived = false, count = itemCount } = {}) => {
      const prefix = String.fromCharCode(66 + (index % 20));
      const items = makeItems(count, prefix);
      const eventTypes = ['feed', 'observation', 'count_check', 'environment_check'];
      const events = Array.from({ length: historyCount }, (_, eventIndex) => {
        const type = eventTypes[eventIndex % eventTypes.length];
        return {
          id: index * 1000 + eventIndex + 1,
          type,
          date: `2026-08-${String(24 - (eventIndex % 20)).padStart(2, '0')}`,
          note: type === 'observation' ? '群全体の活動と巣の状態を確認' : '',
          data: type === 'feed'
            ? { prey_type: 'Drosophila hydei', quantity: 0 }
            : type === 'count_check'
              ? { current_count: living, difference: -1 }
              : type === 'environment_check'
                ? { temperature: 26.2, humidity: 73 }
                : { label: '状態確認' }
        };
      });
      return {
        id: index + 1,
        name: longText ? `Seladonia 2026-${index + 1} 長期繁殖管理群・飼育条件比較用の非常に長い管理名称` : `Seladonia 2026-${String(index + 1).padStart(2, '0')}`,
        prefix,
        birth_date: '2026-08-04',
        species_id: 314,
        species_name: longText
          ? 'Typhochlaena seladonia natural history reference population with exceptionally long taxonomic identification'
          : 'Typhochlaena seladonia',
        count,
        living_count: living,
        archived,
        stats: { alive: living, dead: Math.max(0, count - living), rehomed: archived ? 3 : 0 },
        development: Array.from({ length: developmentCount }, (_, developmentIndex) => ({
          instar: developmentIndex + 2,
          count: Math.max(0, Math.floor(living / Math.max(1, developmentCount)) + (developmentIndex === 0 ? living % Math.max(1, developmentCount) : 0))
        })),
        events,
        items
      };
    };

    const activeGroups = Array.from({ length: groupCount }, (_, index) => makeGroup(index));
    const archivedGroups = Array.from({ length: archivedCount }, (_, index) => makeGroup(index + groupCount, { archived: true }));
    const group = activeGroups[0] || makeGroup(0);
    const babyGroups = {
      items: activeGroups,
      archived_items: archivedGroups,
      summary: {
        currently_managed: activeGroups.reduce((total, item) => total + Number(item.living_count || 0), 0),
        active_groups: activeGroups.length,
        dead: activeGroups.reduce((total, item) => total + Number(item.stats.dead || 0), 0),
        rehomed: activeGroups.reduce((total, item) => total + Number(item.stats.rehomed || 0), 0)
      }
    };
    const careProfile = {
      defaults: { feed: 3, observation: 2, count: 7, environment: 7, dueSoonDays: 3 },
      species: {},
      nurseries: {}
    };
    const animals = [
      { id: 1, code: 'C001', species_name: 'Typhochlaena seladonia' },
      { id: 2, code: 'C014', species_name: 'Typhochlaena seladonia' }
    ];
    const app = document.querySelector('#app');
    const startedAt = performance.now();

    if (mode === 'registry') {
      app.innerHTML = renderCollection({ tab: 'babies', babyGroups, nurseryCareProfile: careProfile });
    } else if (mode === 'detail') {
      app.innerHTML = renderCollection({ tab: 'babies', babyGroups, babyDetail: group, nurseryCareProfile: careProfile });
    } else if (mode === 'care') {
      app.innerHTML = renderNurseryCarePlanSettings(careProfile, activeGroups);
    } else {
      const modalType = ({
        'group-form': 'baby-group',
        'event-form': 'nursery-event',
        'bulk-form': 'baby-bulk',
        'promote-form': 'baby-promote',
        'qr-form': 'baby-qr'
      })[mode] || 'baby-group';
      const qrSelection = createBabyQrSelection(group);
      qrSelection.mode = fixtureParams.get('qrMode') || qrSelection.mode;
      app.innerHTML = renderModal({
        type: modalType,
        group,
        groupId: group.id,
        eventType: fixtureParams.get('event') || 'count_check',
        selection: qrSelection,
        submitting: fixtureParams.get('busy') === '1',
        error: fixtureParams.get('error') === '1' ? '保存できませんでした。入力内容を確認してください。' : '',
        data: fixtureParams.get('editing') === '1' ? group : {}
      }, { animals });
    }

    requestAnimationFrame(() => {
      const row = app.querySelector('.nursery-registry-row');
      const rowStyle = row ? getComputedStyle(row) : null;
      document.body.dataset.overflow = document.documentElement.scrollWidth <= window.innerWidth + 1 ? 'pass' : 'fail';
      document.body.dataset.renderMs = String(Math.round((performance.now() - startedAt) * 10) / 10);
      document.body.dataset.registryRows = String(app.querySelectorAll('.nursery-registry-row').length);
      document.body.dataset.desktopRows = String(app.querySelectorAll('.nursery-specimen-registry tbody tr').length);
      document.body.dataset.mobileRows = String(app.querySelectorAll('.nursery-specimen-mobile-row').length);
      document.body.dataset.rowRadius = rowStyle?.borderRadius || '';
      document.body.dataset.rowShadow = rowStyle?.boxShadow || '';
    });
  </script>
</body>
</html>
