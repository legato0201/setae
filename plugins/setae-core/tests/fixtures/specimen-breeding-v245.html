<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SETAE v1.0.245 Breeding Fixture</title>
  <link rel="stylesheet" href="../../assets/app/styles/tokens.css">
  <link rel="stylesheet" href="../../assets/app/styles/reset.css">
  <link rel="stylesheet" href="../../assets/app/styles/foundation.css">
  <link rel="stylesheet" href="../../assets/app/styles/components.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/property-list.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/activity-list.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/identity-panel.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/data-visualization.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/media-grid.css">
  <link rel="stylesheet" href="../../assets/app/styles/patterns/specimen-workspace.css">
  <link rel="stylesheet" href="../../assets/app/styles/screens/specimen.css">
  <link rel="stylesheet" href="../../assets/app/styles/screens/quick-record.css">
  <link rel="stylesheet" href="../../assets/app/styles/components/mobile-gestures.css">
  <style>#fixture-root { min-height: 100dvh; }</style>
</head>
<body>
  <main id="fixture-root"></main>
  <script type="module">
    import { renderAnimalDetail } from '../../assets/app/pages/animal-detail.js';
    import { renderRecordForm } from '../../assets/app/features/records/record-form-view.js';
    import { applyRecordToAnimals, recordDataFromForm, resolveRecordType } from '../../assets/app/features/records/actions.js';
    import { resolveActionInvocation } from '../../assets/app/components/overlay-controller.js';

    const root = document.querySelector('#fixture-root');
    let animal = {
      id: 14,
      title: 'C014',
      manage_code: 'C014',
      species_name: 'Typhochlaena seladonia',
      scientific_name: 'Typhochlaena seladonia',
      gender: 'female',
      instar: 8,
      status: 'normal',
      bl_status: 'none',
      acquired_date: '2025-11-02'
    };
    let events = [];
    let specimenTab = 'breeding';
    let quickRecord = null;
    let lastPayload = null;
    let error = '';

    function render() {
      const page = renderAnimalDetail({ animal, events, babyGroups: [], tab: specimenTab });
      const sheet = quickRecord ? renderRecordForm({ quickRecord, animals: [animal], selectedAnimalId: animal.id, recent: [], today: '2026-08-27' }) : '';
      root.innerHTML = `${page}${sheet}${error ? `<div role="alert">${error}</div>` : ''}`;
    }

    function openRecord(type, animalId) {
      const resolved = resolveRecordType(type);
      if (!resolved) {
        error = '記録の種類を確認できませんでした。画面を更新して、もう一度お試しください。';
        render();
        return;
      }
      quickRecord = {
        view: 'form',
        type: resolved,
        animalId: String(animalId || animal.id),
        animalIds: [],
        submitting: false,
        error: null
      };
      render();
    }

    root.addEventListener('click', (event) => {
      const invocation = resolveActionInvocation(event);
      if (!invocation?.action) return;
      const { action, element } = invocation;
      if (action === 'specimen-tab') {
        specimenTab = element.dataset.tab;
        render();
      } else if (['smart-quick-record', 'quick-recommendation', 'quick-recent', 'start-record', 'record-type'].includes(action)) {
        openRecord(element.dataset.recordType, element.dataset.animalId);
      } else if (action === 'close-quick-record' || action === 'close-sheet' || action === 'back-record-types') {
        quickRecord = null;
        render();
      }
    });

    root.addEventListener('submit', (event) => {
      const form = event.target.closest('[data-role="record-form"]');
      if (!form) return;
      event.preventDefault();
      const formData = new FormData(form);
      const type = resolveRecordType(quickRecord?.type);
      const data = recordDataFromForm(formData, type);
      const date = String(formData.get('date') || '');
      lastPayload = { type, date, data };
      events = [{ id: `fixture-${events.length + 1}`, type, date, data }, ...events];
      [animal] = applyRecordToAnimals([animal], [animal.id], type, date, data);
      quickRecord = null;
      render();
    });

    window.__setaeBreeding245 = {
      state: () => ({ animal, events, specimenTab, quickRecord, lastPayload, error }),
      openRecord
    };
    render();
    document.body.dataset.fixtureReady = 'true';
  </script>
</body>
</html>
