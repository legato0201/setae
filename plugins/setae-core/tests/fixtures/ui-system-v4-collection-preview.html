<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SETAE UI System v4 Collection</title>
  <script>
    const previewParams = new URLSearchParams(location.search);
    if (previewParams.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    const specimenAssetBase = new URL('../../assets/images/specimen/', location.href);
    window.SETAE_CONFIG = {
      siteOrigin: location.origin,
      iconOverrides: previewParams.get('customIcon') === '1'
        ? { 'nav.collection': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/></svg>' }
        : {},
      specimenAssets: {
        spider: previewParams.get('brokenSpecimen') === '1'
          ? new URL('missing-specimen.svg', location.href).href
          : new URL('spider-silhouette.svg', specimenAssetBase).href,
        generic: new URL('generic-specimen.svg', specimenAssetBase).href
      }
    };
  </script>
  <link rel="stylesheet" href="../../assets/app/styles/tokens.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/reset.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/foundation.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/workbench.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/combobox.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/action-menu.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/property-list.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/activity-list.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/identity-panel.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/data-visualization.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/media-grid.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/components/media.css?v=1.0.242">
  <link rel="stylesheet" href="../../assets/app/styles/components/specimen-card.css?v=1.0.242">
  <link rel="stylesheet" href="../../assets/app/styles/components/update-notice.css?v=1.0.242">
  <link rel="stylesheet" href="../../assets/app/styles/screens/qr.css?v=1.0.242">
  <link rel="stylesheet" href="../../assets/app/styles/app-frame.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/patterns/workspace.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/patterns/registry.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/patterns/specimen-workspace.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/screens/collection.css?v=1.0.229-inset">
  <link rel="stylesheet" href="../../assets/app/styles/screens/collection-editor.css?v=1.0.242">
  <link rel="stylesheet" href="../../assets/app/styles/screens/specimen.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/screens/specimen-intake.css?v=1.0.229">
  <link rel="stylesheet" href="../../assets/app/styles/screens/settings.css?v=1.0.229">
</head>
<body>
  <div id="fixture-root"></div>
  <script type="module">
    import { renderAppFrame } from '../../assets/app/components/app-frame.js';
    import { renderCollection } from '../../assets/app/pages/collection.js';
    import { renderAnimalCardEditor } from '../../assets/app/features/collection/card-editor.js';
    import { renderCollectionStatusDialog } from '../../assets/app/features/collection/dialog.js';
    import { registerMediaFallbacks } from '../../assets/app/components/media.js';

    const params = new URLSearchParams(location.search);
    const specimenPhoto = new URL('../../assets/images/specimen/spider.svg', location.href).href;
    const animals = [
      ['C001', 'Typhochlaena seladonia', 'female', 'pre_molt', 8, 'CB', 2, 22],
      ['C002', 'Caribena versicolor', 'female', 'normal', 7, 'CB', 0, 41],
      ['C003', 'Poecilotheria regalis', 'male', 'fasting', 10, 'WC', 9, 67],
      ['C004', 'Psalmopoeus irminia', 'female', 'normal', 6, 'CB', 4, 18],
      ['C005', 'Harpactira pulchripes', 'unknown', 'post_molt', 5, 'CB', 13, 1],
      ['C006', 'Cyriopagopus lividus', 'female', 'normal', 9, 'WC', 6, 29],
      ['C007', 'Aphonopelma chalcodes', 'female', 'normal', 12, 'CB', 5, 88],
      ['C008', 'Dolichothele diamantinensis', 'male', 'pre_molt', 7, 'CB', 11, 34]
    ].map(([code, species, gender, status, instar, origin, feedDays, moltDays], index) => ({
      id: index + 1,
      individual_code: code,
      species_name: species,
      family_name: 'Theraphosidae',
      classification: 'tarantula',
      image_url: index < 3 || index === 7 ? specimenPhoto : '',
      gender,
      status,
      instar,
      origin,
      last_feed: new Date(Date.now() - feedDays * 86400000).toISOString(),
      last_molt: new Date(Date.now() - moltDays * 86400000).toISOString(),
      last_observation: new Date(Date.now() - (index + 1) * 86400000).toISOString()
    }));
    const views = [
      { id: 'all', title: 'すべて', builtin: true, query: { filters: [], sort: { field: 'code', direction: 'asc' } } },
      { id: 'favorites', title: 'お気に入り', builtin: true, query: { filters: [], sort: { field: 'code', direction: 'asc' } } },
      { id: 'pre_molt', title: '脱皮前', builtin: true, query: { filters: [{ field: 'status', operator: '=', value: 'pre_molt' }], sort: { field: 'code', direction: 'asc' } } }
    ];
    const state = {
      mode: params.get('view') === 'gallery' ? 'gallery' : 'table',
      cardMode: ['photo', 'hybrid', 'data'].includes(params.get('card')) ? params.get('card') : 'photo',
      selection: {
        selectedId: '2',
        selectedIds: params.get('dialog') === '1' ? ['1', '2', '3'] : params.get('selected') === '1' ? ['1', '3'] : [],
        selectionMode: params.get('selected') === '1'
      }
    };
    const detailedCard = params.get('details') === '1';
    const cardFields = detailedCard
      ? { lastObservation: true, origin: true, temperature: true, humidity: true }
      : {};
    const cardActions = detailedCard
      ? ['observation', 'growth', 'molt']
      : ['feed', 'observation'];

    function draw() {
      const content = renderCollection({
        tab: 'animals',
        animals,
        animalMode: state.mode,
        animalViews: views,
        activeAnimalView: views[0],
        collectionSelection: state.selection,
        animalCardConfig: { mode: state.cardMode, density: 'standard', fields: cardFields, quickActions: cardActions }
      });
      const overlaysHtml = params.get('editor') === '1'
        ? renderAnimalCardEditor({ mode: state.cardMode, density: 'standard', fields: cardFields, quickActions: cardActions }, animals[0])
        : params.get('dialog') === '1'
          ? renderCollectionStatusDialog({ count: state.selection.selectedIds.length })
          : '';
      document.querySelector('#fixture-root').innerHTML = renderAppFrame({
        content,
        page: 'animals',
        pageTitle: 'コレクション',
        authenticated: true,
        online: true,
        userName: 'テスト飼育者',
        activeViewId: 'all',
        savedViews: [{ id: 'adult-females', title: '成体メス' }],
        overlaysHtml
      });
    }

    document.querySelector('#fixture-root').addEventListener('click', (event) => {
      const row = event.target.closest('[data-collection-animal]');
      if (row && !event.target.closest('[data-action]')) {
        state.selection = { ...state.selection, selectedId: row.dataset.animalId };
        draw();
        return;
      }
      const action = event.target.closest('[data-action]');
      if (action?.dataset.action === 'animal-card-mode') {
        state.mode = action.dataset.cardMode === 'table' ? 'table' : 'gallery';
        draw();
        return;
      }
      if (action?.dataset.action === 'collection-selection-mode') {
        state.selection = { ...state.selection, selectionMode: !state.selection.selectionMode };
        draw();
        return;
      }
      if (action?.dataset.action === 'toggle-collection-selection') {
        const id = String(action.dataset.animalId || '');
        const selectedIds = new Set(state.selection.selectedIds.map(String));
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        state.selection = { ...state.selection, selectedIds: [...selectedIds], selectionMode: true };
        draw();
      }
    });

    registerMediaFallbacks(document.querySelector('#fixture-root'), { timeoutMs: 1000 });
    draw();
  </script>
</body>
</html>
